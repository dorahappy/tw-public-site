<!doctype html>

  <title>双晓 · 一起，慢慢看世界</title>
  <style>
    :root{color-scheme:light;--bg:#eef0ed;--ink:#172027;--muted:#657078;--line:#ccd1cd;--accent:#c6422c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}a{color:inherit}a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}.shell{width:min(1100px,calc(100% - 48px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:27px 0;border-bottom:1px solid var(--line)}.brand{font-weight:750;text-decoration:none;font-size:20px;letter-spacing:.08em}.top span{font-size:12px;color:var(--muted)}.intro{padding:68px 0 43px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.16em;margin:0 0 17px}h1{font-size:clamp(35px,5.4vw,63px);letter-spacing:-.04em;line-height:1.22;margin:0 0 22px;font-weight:720}.intro>p:last-child{color:var(--muted);margin:0;max-width:530px}.journey{display:grid;grid-template-columns:1.25fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;gap:44px;align-items:center}.photo{display:block;overflow:hidden;border-radius:5px}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.chapter{font-size:12px;color:var(--muted);letter-spacing:.1em}.details h2{font-size:32px;letter-spacing:-.03em;line-height:1.25;margin:16px 0}.details p{color:var(--muted);font-size:14px;max-width:320px}.link{display:inline-block;padding:12px 0;margin-top:13px;font-size:14px;font-weight:650;text-decoration:none;border-bottom:1px solid var(--accent)}.link span{color:var(--accent);margin-left:22px}.link:hover{color:var(--accent)}footer{padding:30px 0 46px;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted)}@media(max-width:640px){.shell{width:calc(100% - 36px)}.top{padding:22px 0}.intro{padding:46px 0 32px}.journey{grid-template-columns:1fr;gap:18px}.photo img{aspect-ratio:3/2}.details h2{font-size:28px}.details p{max-width:none}.chapter{margin:0}footer{display:block}footer span{display:block;margin-top:6px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><a class="brand" href="./" aria-label="双晓首页">双晓</a><span>旅途与日常的小小收藏</span></header>
    <main>
      <section class="intro" aria-labelledby="welcome"><p class="eyebrow">一路同行 · 慢慢记录</p><h1 id="welcome">一起，慢慢看世界。</h1><p>把走过的路、想看的风景，还有值得记住的日常，收在这里。</p></section>
      <article class="journey" aria-labelledby="travel-title">
        <a class="photo" href="travel/" aria-label="打开双晓漫游记"><img src="travel/travel-assets/europe-journey-hero.jpg" width="1600" height="1067" alt="清晨，多洛米蒂群山间的一条蜿蜒公路"></a>
        <div class="details"><p class="chapter">01 / 旅行 · 2026 秋</p><h2 id="travel-title">双晓漫游记</h2><p>从杭州出发，去欧洲过秋天。一起看多洛米蒂的山，也看佛罗伦萨、罗马和巴黎的艺术。</p><a class="link" href="travel/">翻开旅行手册 <span aria-hidden="true">→</span></a></div>
      </article>
    </main>
    <footer><span>双晓 · 一起出发，也一起回家。</span><span>故事，慢慢继续。</span></footer>
  </div>
</body>
